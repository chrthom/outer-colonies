<div id="background-stars" [class]="'background-stars-' + bgNo">
  <div id="background-layer"></div>
</div>

<a class="skip-link" href="#main-content" (click)="$event.preventDefault(); mainContent.focus()"
  >Zum Inhalt springen</a
>
<header>
  <oc-navbar></oc-navbar>
</header>

<div id="root-content">
  <main #mainContent id="main-content" tabindex="-1">
    <router-outlet></router-outlet>
  </main>
  <footer id="footer">
    <div id="footer-links">
      <ul>
        <li><a routerLink="/world">Die Welt</a></li>
        <li><a routerLink="/factions">Die Mächte</a></li>
        <li><a routerLink="/history">Die Geschichte</a></li>
        <li><a routerLink="/editions">Die Editionen</a></li>
        <li><button type="button" (click)="openImprint()">Impressum</button></li>
        <li><button type="button" (click)="openDataPrivacy()">Datenschutz</button></li>
      </ul>
    </div>
    <a
      id="version"
      href="https://github.com/chrthom/outer-colonies/releases"
      target="_blank"
      rel="noopener noreferrer"
    >
      @if (env.stage !== "production") {
        <span class="version-stage">{{ env.stage }} environment</span><br />
      }
      <span class="version-name">Outer Colonies - {{ releaseName }} (v{{ version }})</span>
    </a>
  </footer>
</div>
