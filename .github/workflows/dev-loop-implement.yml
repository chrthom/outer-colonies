name: Dev Loop Implement

on:
  issues:
    # No unlabeled trigger: needs-human is ignored on issues, so removing it is
    # not a resume event for the implementer - the manual backstop
    # (workflow_dispatch) covers a retry after a needs-human escalation, or
    # moving the issue back to Todo + re-adding dev-loop.
    types: [opened, reopened, labeled, status_changed]
  workflow_dispatch:
    inputs:
      issue_number:
        description: Issue number to implement (manual backstop / retry)
        required: true
        type: string
      retry:
        description: Internal retry counter (do not edit)
        required: false
        default: '0'
        type: string

permissions:
  contents: write
  pull-requests: write
  issues: write
  actions: write

concurrency:
  group: dev-loop-issue-${{ github.event.issue.number || inputs.issue_number }}
  cancel-in-progress: false

jobs:
  implement:
    name: Implementer
    # Job-level event filter (misc/dev-loop.md): a labeled event for any
    # label other than dev-loop, a status_changed event to any status other
    # than Todo (id=3), or an opened/reopened/labeled event on an issue whose
    # status is not Todo (id=3) can never start the implementer - skip before
    # a runner is allocated. The gate below remains as defense in depth.
    if: >-
      !(github.event_name == 'issues' && github.event.action == 'labeled' && github.event.label.name != 'dev-loop') &&
      !(github.event_name == 'issues' && github.event.action == 'status_changed' && github.event.status.id != 3) &&
      !(github.event_name == 'issues' && (github.event.action == 'opened' || github.event.action == 'reopened' || github.event.action == 'labeled') && github.event.issue.status.id != 3)
    runs-on: ubuntu-latest
    # 15 min above --time-limit (5400 s = 90 min), per misc/dev-loop.md budgets table
    timeout-minutes: 105
    env:
      GH_REPO: ${{ github.repository }}
      MAX_TURNS: '800'
      MAX_TOKENS: '6000000'
      TIME_LIMIT_SEC: '5400'
      TIME_LIMIT_MIN: '90'
      VIBE_VERSION: '3.1.5'
      VIBE_MODEL: 'zai-glm-5-3'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          token: ${{ secrets.DEV_LOOP_TOKEN }}

      - name: Gate and dedupe
        id: gate
        env:
          GH_TOKEN: ${{ secrets.DEV_LOOP_TOKEN }}
          ISSUE_NUMBER: ${{ github.event.issue.number || inputs.issue_number }}
          EVENT_NAME: ${{ github.event_name }}
          EVENT_ACTION: ${{ github.event.action }}
          LABELED_NAME: ${{ github.event.label.name }}
          EVENT_STATUS_ID: ${{ github.event.status.id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
        run: |
          set -eu
          if [ -z "$ISSUE_NUMBER" ]; then
            echo "No issue number in event; nothing to do."
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # Opt-in gate, first line, before all other checks: no dev-loop label,
          # no loop. `labeled: dev-loop` or `status_changed` to Todo starts the
          # loop on an existing issue.
          if [ "$EVENT_ACTION" = "labeled" ] && [ "$LABELED_NAME" != "dev-loop" ]; then
            echo "Labeled '$LABELED_NAME', not dev-loop; skipping."
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ "$EVENT_ACTION" = "status_changed" ] && [ "$EVENT_STATUS_ID" != "3" ]; then
            echo "Status changed to id='$EVENT_STATUS_ID', not Todo (3); skipping."
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          gh label create needs-human --color B60205 \
            --description "dev-loop: human decision required" 2>/dev/null || true
          gh label create dev-loop --color 46A1AA \
            --description "Development and reviewing is performed by an agentic AI dev-loop" 2>/dev/null || true
          # Poll live issue state via REST API (gh issue view --json does not
          # expose planning status). Retry boundedly and fail visible on
          # persistent errors so a transient API blip does not silently masquerade
          # as a missing label or wrong status.
          issue_json=""
          for attempt in 1 2 3 4 5; do
            issue_json="$(gh api "repos/${GH_REPO}/issues/${ISSUE_NUMBER}" 2>/dev/null || true)"
            if [ -n "$issue_json" ] && jq -e '.number' <<<"$issue_json" >/dev/null 2>&1; then
              break
            fi
            issue_json=""
            [ "$attempt" = 5 ] || sleep 10
          done
          if [ -z "$issue_json" ]; then
            echo "::warning::Issue poll failed after 5 attempts; cannot evaluate the gate on issue #$ISSUE_NUMBER. Skipping - re-run via workflow_dispatch to retry (fail visible, no red run)."
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if printf '%s' "$issue_json" | jq -e '.pull_request != null' >/dev/null; then
            echo "#$ISSUE_NUMBER is a pull request, not an issue; skipping."
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          issue_state="$(printf '%s' "$issue_json" | jq -r '.state // empty')"
          if [ "$issue_state" != "open" ]; then
            echo "Issue #$ISSUE_NUMBER is '$issue_state', not open; skipping."
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if ! printf '%s' "$issue_json" | jq -e 'any(.labels[]; .name == "dev-loop")' >/dev/null; then
            echo "Issue #$ISSUE_NUMBER lacks the dev-loop label; the loop is opt-in. Skipping."
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # Lifecycle gate (misc/dev-loop.md): only start issues on Todo (id=3)
          # so Backlog / In progress / In review issues stay untouched.
          # workflow_dispatch (including internal retry=1) and Actions re-runs
          # (RUN_ATTEMPT > 1) also accept In progress (id=4) because the
          # initial run moves the issue there before pre-agent setup steps.
          status_id="$(printf '%s' "$issue_json" | jq -r '.status.id // 0')"
          status_name="$(printf '%s' "$issue_json" | jq -r '.status.name // "none"')"
          if [ "$EVENT_NAME" != "workflow_dispatch" ] && [ "${RUN_ATTEMPT:-1}" = "1" ] && [ "$status_id" != "3" ]; then
            echo "Issue #$ISSUE_NUMBER status is '$status_name' (id=$status_id), not Todo (3); skipping."
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if { [ "$EVENT_NAME" = "workflow_dispatch" ] || [ "${RUN_ATTEMPT:-1}" != "1" ]; } && [ "$status_id" != "3" ] && [ "$status_id" != "4" ]; then
            echo "Issue #$ISSUE_NUMBER status is '$status_name' (id=$status_id), not Todo (3) or In progress (4); skipping."
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # needs-human on an issue is informational only: parking is done by
          # removing the dev-loop label (the escalation post-step does exactly
          # that), and the resume path is re-adding dev-loop (with status Todo).
          # The gate therefore does not skip on needs-human.
          if [ -n "$(git ls-remote origin "refs/heads/vibe/issue-$ISSUE_NUMBER-*")" ]; then
            echo "Branch vibe/issue-$ISSUE_NUMBER-* already exists; skipping."
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # Move the issue to In progress (id=4) right before handing off to
          # the agent so the board reflects active work and queued duplicate
          # events (e.g. opened + status_changed) see In progress and skip.
          if [ "$status_id" != "4" ]; then
            if gh api -X PATCH "repos/${GH_REPO}/issues/${ISSUE_NUMBER}" -f status="In progress" >/dev/null 2>&1; then
              echo "Moved issue #$ISSUE_NUMBER status to In progress."
            else
              echo "::warning::Could not move issue #$ISSUE_NUMBER status to In progress (best-effort); proceeding."
            fi
          fi
          echo "issue_number=$ISSUE_NUMBER" >> "$GITHUB_OUTPUT"

      - name: Set up Node.js
        if: steps.gate.outputs.skip != 'true'
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: |
            server/package-lock.json
            client/package-lock.json
            website/package-lock.json

      - name: Install dependencies
        if: steps.gate.outputs.skip != 'true'
        run: for p in server client website; do (cd "$p" && npm ci); done

      - name: Render role prompt with budget
        if: steps.gate.outputs.skip != 'true'
        run: |
          mkdir -p out
          sed -e "s/\${MAX_TURNS}/${MAX_TURNS}/g" \
              -e "s/\${TIME_LIMIT_MIN}/${TIME_LIMIT_MIN}/g" \
              .github/dev-loop/prompts/implementer.md > out/implementer.rendered.md
          echo "--- rendered prompt ---"
          cat out/implementer.rendered.md

      - name: Install vibe
        if: steps.gate.outputs.skip != 'true'
        run: |
          export UV_SYSTEM_CERTS=true
          if ! command -v uv >/dev/null 2>&1; then
            curl -LsSf https://astral.sh/uv/install.sh | sh
            export PATH="$HOME/.local/bin:$PATH"
          fi
          uv tool install --force --python cpython-3.14+gil "mistral-vibe==$VIBE_VERSION" 2>/dev/null \
            || { uv python install cpython-3.14 && uv tool install --force --python cpython-3.14+gil "mistral-vibe==$VIBE_VERSION"; }
          vibe_bin_dir="$(uv --color never tool dir --bin)"
          echo "$vibe_bin_dir" >> "$GITHUB_PATH"
          export PATH="$vibe_bin_dir:$PATH"
          command -v vibe
          vibe --version | grep -F "$VIBE_VERSION" || {
            echo "::error::Installed vibe version does not match the expected $VIBE_VERSION - verify the invocation against the new CLI surface before rerunning"
            exit 1
          }

      - name: Run vibe implementer
        id: vibe
        if: steps.gate.outputs.skip != 'true'
        env:
          MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
          GH_TOKEN: ${{ secrets.DEV_LOOP_TOKEN }}
          DEV_LOOP_ISSUE: ${{ steps.gate.outputs.issue_number }}
          # Job-local Vibe home: MISTRAL_API_KEY must be the only credential
          # source (stored auth or keyring entries would otherwise silently mask
          # a rotated secret).
          VIBE_HOME: ${{ runner.temp }}/vibe-home
          VIBE_TEST_DISABLE_KEYRING: '1'
        run: |
          mkdir -p "$VIBE_HOME"
          # Disable CI update checks and telemetry; register zai-glm-5-3 with
          # Mistral's model-card pricing so --model always resolves even if the
          # remote model catalog is unreachable and export.json reports cost_usd.
          cat > "$VIBE_HOME/config.toml" <<'EOF'
          enable_update_checks = false
          enable_telemetry = false
          EOF
          if [ "$VIBE_MODEL" = "zai-glm-5-3" ]; then
            cat >> "$VIBE_HOME/config.toml" <<'EOF'

          [[models]]
          name = "zai-glm-5-3"
          provider = "mistral"
          alias = "zai-glm-5-3"
          display_name = "Z.ai GLM 5.3"
          input_price = 1.4
          output_price = 4.4
          cached_input_price = 0.14
          max_context_length = 1048576
          supports_images = false
          EOF
          fi

          set +e
          timeout --signal=TERM --kill-after=60 "$((TIME_LIMIT_SEC + 120))" \
            vibe --prompt-file "out/implementer.rendered.md" \
              --auto-approve \
              --trust \
              --model "$VIBE_MODEL" \
              --max-turns "$MAX_TURNS" \
              --max-tokens "$MAX_TOKENS" \
              --time-limit "$TIME_LIMIT_SEC" \
              --output streaming \
              --output-dir out \
              > out/stream.ndjson 2> out/vibe.stderr
          rc=$?
          set -e
          echo "rc=$rc" >> "$GITHUB_OUTPUT"
          echo "--- vibe stderr ---"
          cat out/vibe.stderr || true
          exit 0

      - name: Upload vibe output artifact
        if: always() && steps.gate.outputs.skip != 'true'
        uses: actions/upload-artifact@v5
        with:
          # The issue number in the name associates the artifact with its
          # dev-loop issue for the cost report workflow (misc/dev-loop.md):
          # artifact names are the only artifact metadata that can be
          # filtered without a download.
          name: vibe-implementer-output-issue-${{ steps.gate.outputs.issue_number }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: out/
          if-no-files-found: warn

      - name: Post-step state machine
        if: always() && steps.gate.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ secrets.DEV_LOOP_TOKEN }}
          ISSUE_NUMBER: ${{ steps.gate.outputs.issue_number }}
          RETRY_COUNT: ${{ inputs.retry || '0' }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
          REPOSITORY: ${{ github.repository }}
          # The same github.repository_owner-derived identity the fixer and
          # reviewer escalation templates address the human through.
          REPO_OWNER: ${{ github.repository_owner }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -u
          escalate() {
            # Park the issue: remove dev-loop (the opt-in gate then skips future
            # events) and add needs-human as the informational marker. Resume =
            # move status back to Todo and re-add dev-loop (or workflow_dispatch).
            # The escalation path must itself fail open: an unguarded gh failure
            # here would red-run the post-step after the agent already finished
            # (losing the outcome) and silently drop the signal. Guard both so
            # at least one reaches a human, with a visible trace when one
            # fails (mirrors post-review.sh).
            gh issue edit "$ISSUE_NUMBER" --remove-label dev-loop --add-label needs-human >/dev/null \
              || echo "::warning::Could not park the issue (gh issue edit failed); relying on the escalation comment."
            cat > /tmp/dev-loop-escalation.md <<EOF
          <!-- dev-loop-escalation -->
          @$REPO_OWNER dev-loop implementer escalation: $1

          Issue: #${ISSUE_NUMBER}
          Run: ${RUN_URL}
          EOF
            gh issue comment "$ISSUE_NUMBER" --body-file /tmp/dev-loop-escalation.md >/dev/null \
              || echo "::warning::Could not post the escalation comment (gh issue comment failed); the needs-human label marks the issue."
          }

          rc="${{ steps.vibe.outputs.rc }}"

          if [ -z "$rc" ]; then
            # vibe never ran: a pre-run step (npm ci, install, version check, render) failed.
            if [ "$RUN_ATTEMPT" = "1" ]; then
              echo "A step failed before the agent ran; leaving a red run for re-run failed jobs."
              exit 1
            fi
            escalate "a workflow step failed before the agent ran (twice); retry via workflow_dispatch (Actions -> Dev Loop Implement -> Run workflow) or move status to Todo and re-add the dev-loop label"
            exit 0
          fi

          # Usage/cost/steps come from out/export.json (plus any subagents).
          # Round cost to cents: every consumer prints $cost verbatim, and raw
          # sums have float artifacts.
          cost="$(jq -r '[(.cost_usd // 0), (.subagents[]?.cost_usd // 0)] | add // 0 | (.*100 | round) / 100' out/export.json 2>/dev/null || echo 0)"
          tokens="$(jq -r '[(.usage.total_tokens // 0), (.subagents[]?.usage.total_tokens // 0)] | add // 0' out/export.json 2>/dev/null || echo 0)"
          steps="$(jq -r '[(.steps // 0), (.subagents[]?.steps // 0)] | add // 0' out/export.json 2>/dev/null || echo 0)"
          outcome="$(jq -r '.outcome // empty' out/export.json 2>/dev/null || true)"
          error_msg="$(jq -r '.error.message // empty' out/export.json 2>/dev/null || true)"
          stderr_tail="$(tail -1 out/vibe.stderr 2>/dev/null || true)"

          if [ "$rc" = "124" ]; then
            # outer timeout(1) backstop hit: never auto-retry, escalate.
            escalate "implementer stopped on the ${TIME_LIMIT_MIN} min deadline (rc=124, cost: \$$cost); see the vibe output artifact"
            exit 0
          fi

          if [ "$rc" = "3" ]; then
            # Vibe programmatic limit/deadline/termination/length/refusal: never auto-retry, escalate.
            case "$outcome" in
              deadline|terminated)
                escalate "implementer stopped on the ${TIME_LIMIT_MIN} min deadline (${outcome}; rc=3, cost: \$$cost); see the vibe output artifact"
                ;;
              *)
                escalate "implementer budget stop (${outcome:-unknown}; rc=3, steps: ${steps}/${MAX_TURNS}, tokens: ${tokens}/${MAX_TOKENS}, cost: \$$cost); see the vibe output artifact"
                ;;
            esac
            exit 0
          fi

          if [ "$rc" = "1" ]; then
            # usage_error / config_error: deterministic misconfiguration, never auto-retry.
            escalate "vibe failed (rc=1, outcome=${outcome:-unknown}, cost: \$$cost, ${error_msg:-$stderr_tail}); see the vibe output artifact"
            exit 0
          fi

          if [ "$rc" = "2" ]; then
            # infrastructure_failure: transient API/runtime failure, single auto-retry via workflow_dispatch.
            if [ "$RETRY_COUNT" -lt 1 ] \
              && gh workflow run dev-loop-implement.yml --ref main -f issue_number="$ISSUE_NUMBER" -f retry=1; then
              echo "vibe failed with infrastructure_failure (rc=2, cost: \$$cost); re-dispatching the implementer once (retry=1). Vibe output artifact preserved for diagnosis."
              exit 0
            fi
            if [ "$RETRY_COUNT" -ge 1 ]; then
              escalate "vibe failed with an infrastructure failure (rc=2, retry exhausted; cost: \$$cost, ${error_msg:-$stderr_tail}); see the vibe output artifact"
            else
              escalate "vibe failed with an infrastructure failure (rc=2, retry unavailable - the re-dispatch failed; cost: \$$cost, ${error_msg:-$stderr_tail}); see the vibe output artifact"
            fi
            exit 0
          fi

          if [ "$rc" = "0" ]; then
            # Final assistant text = last non-empty line of the last non-discarded assistant message.
            final_msg="$(jq -Rrs '[split("\n")[] | fromjson? | select(.type == "message" and .role == "assistant" and ((.outcome.type? // "") != "discarded" or (.outcome.cause? // "") == "interrupt")) | ([.content[]? | select(.type == "text") | .text] | join("\n\n")) | select(test("\\S"))] | last // ""' out/stream.ndjson 2>/dev/null || true)"
            outcome_line="$(printf '%s\n' "$final_msg" | awk 'NF { line = $0 } END { if (line) print line }')"
            case "$outcome_line" in
              PR_URL:*)
                echo "Implementer finished: $outcome_line (cost: \$$cost, tokens: $tokens)"
                exit 0
                ;;
              NO_PR:*)
                echo "Implementer reported $outcome_line (questions posted and issue labeled by the agent); no PR opened by design."
                exit 0
                ;;
              WALL:*)
                escalate "implementer stopped early with ${outcome_line} (cost: \$$cost)"
                exit 0
                ;;
              *)
                # A clean exit (rc=0) with no contract line is usually a
                # truncated run (agent stopped mid-implementation without a
                # contract line) - transient, unlike a deterministic parse
                # failure. Retry once via workflow_dispatch; the counter in
                # the retry input prevents a loop. The gate's branch-exists
                # check (vibe/issue-<N>-*) makes a retry after a half-finished
                # run safe: it skips if the implementer got far enough to push.
                if [ "$RETRY_COUNT" -lt 1 ] \
                  && gh workflow run dev-loop-implement.yml --ref main -f issue_number="$ISSUE_NUMBER" -f retry=1; then
                  echo "Unparseable implementer outcome (cost: \$$cost, tokens: $tokens); re-dispatching the implementer once (retry=1). Vibe output artifact preserved for diagnosis."
                  exit 0
                fi
                escalate "unparseable outcome (exit 0, final message does not match the contract; retry exhausted); see the vibe output artifact"
                exit 0
                ;;
            esac
          fi

          if [ "$rc" != "0" ]; then
            escalate "unexpected vibe exit code $rc (outcome=${outcome:-unknown}, cost: \$$cost, ${error_msg:-$stderr_tail}); see the vibe output artifact"
            exit 0
          fi
