@let vm = (vm$ | async) ?? getViewModel();
<button
  type="button"
  class="oc-unstyled-btn continue-button"
  [class.disabled]="!vm.enabled"
  [disabled]="!vm.enabled"
  [attr.aria-label]="vm.text || 'Warte auf Gegenspieler'"
  (click)="onClick()"
  (mouseenter)="onHover(true)"
  (mouseleave)="onHover(false)"
  (focus)="onHover(true)"
  (blur)="onHover(false)"
>
  <span class="label">{{ vm.text }}</span>
  <img [src]="vm.imageUrl" alt="" />
</button>
